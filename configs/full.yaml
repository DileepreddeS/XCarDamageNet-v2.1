# Full run — all aux modules enabled at once, warm-started from Phase A.
#
# Schedule and augmentation are identical to phase_a.yaml; the only differences
# are the three aux module flags and the checkpoint this initialises from.

phase: full
description: attention + physics + contrastive, all enabled

model: /home/ds3424/XCarDamageNet-v2.1/models/phase_a_best.pt
data: /scratch/ds3424/cardd/yolo/cardd.yaml
project: /scratch/ds3424/cardd
name: cardd_v21_full

# --- schedule -------------------------------------------------------------
imgsz: 1024
batch: 8
epochs: 200
patience: 50
cos_lr: true
save_period: 10
amp: false                 # fp16 produced NaN losses on this setup
workers: 8

# --- optimiser ------------------------------------------------------------
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
momentum: 0.937
weight_decay: 0.0005

# --- loss gains -----------------------------------------------------------
box: 7.5
cls: 0.5
dfl: 1.5

# --- cls-term class weighting ---------------------------------------------
# Exactly ONE of the two schemes below may be true. Both write the same
# attribute (model.class_weights), so enabling both makes the run
# unattributable — the trainer raises rather than letting one win silently.
#
# DIFFICULTY-AWARE (in use): w_c = 1 / AP_c from Phase A, normalised to sum to
# nc. Weight goes to what the detector actually gets wrong.
#
#   crack=1.3550  dent=1.1746  scratch=1.1479
#   lamp_broken=0.8190  tire_flat=0.7861  glass_shatter=0.7174
#
# Ratio 1.89x — a much gentler intervention than CB's 10.15x, deliberately so.
#
# CAVEAT: those APs are TEST-split numbers, so this run's test mAP is not a
# clean held-out estimate. Refit PHASE_A_TEST_AP50 from Phase A VALIDATION AP
# for the publishable version. See docs/DIFFICULTY_WEIGHTS.md.
difficulty_weights: true

# CLASS-BALANCED (Cui et al., CVPR 2019): w_c = 1/effective-number-of-samples.
# MEASURED AND REJECTED on CarDD — it weights by frequency, which turned out to
# be near-uncorrelated with difficulty here: it boosted the already-strong
# tire_flat (0.898 -> 0.966) and starved the hardest class, crack
# (0.521 -> 0.399). Kept switchable so the ablation row is reproducible.
cb_loss: false
cb_beta: 0.9999

# Whichever scheme is on attaches via ultralytics' native `model.class_weights`
# hook, which v8DetectionLoss multiplies into bce_loss
# (ultralytics/utils/loss.py:433). An on_train_batch_start callback prints the
# values read back OFF the live criterion object; v1's version printed
# "applied" without ever attaching.

# NOTE: ultralytics' own cls_pw inverse-frequency weighting writes to the same
# attribute. It defaults to 0.0 (disabled) and must stay there — setting both
# would mean whichever ran last silently wins.
cls_pw: 0.0

# --- augmentation ---------------------------------------------------------
mosaic: 1.0
mixup: 0.10
copy_paste: 0.30
close_mosaic: 20
fliplr: 0.5
flipud: 0.0
degrees: 0.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# --- aux modules ----------------------------------------------------------
use_attention: true        # AttentionMapHead        -> L_attn     (0.10)
use_physics: true          # adapter + physics + implied-class head -> L_physics (0.02)
use_contrastive: true      # ContrastiveDamageModule -> L_contrast (0.05)

# Token attach point for physics/contrastive. The attention head is always on
# P3 regardless. Change these ONLY as the documented OOM fallback, and never
# silently — both values are printed at startup and belong in results/runs.csv.
#   attach: p3, token_stride: 1  -> 16,384 tokens (default)
#   attach: p3, token_stride: 2  ->  4,096 tokens (first fallback)
#   attach: p4, token_stride: 1  ->  4,096 tokens (second fallback)
attach: p3
token_stride: 1
suspicious_thresh: 0.5

# --- backup ---------------------------------------------------------------
# best.pt is copied here every `backup_every` epochs; scratch is volatile.
backup_dir: /home/ds3424/XCarDamageNet-v2.1/models
backup_every: 10
