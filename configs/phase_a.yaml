# Phase A — stock YOLO11m @1024, batch=8.
#
# Baseline control for the ablation series: no custom modules, stock
# ultralytics end to end.

phase: a
description: stock YOLO11m @1024 batch=8 matched control

model: yolo11m.pt          # COCO-pretrained
data: /scratch/ds3424/cardd/yolo/cardd.yaml
project: /scratch/ds3424/cardd
name: cardd_v21_phase_a

# --- schedule -------------------------------------------------------------
imgsz: 1024
batch: 8                   # all phases run at 8, so the ablation is matched
epochs: 200
patience: 50
cos_lr: true
save_period: 10            # periodic checkpoint safety
amp: false                 # fp16 produced NaN losses on this setup
workers: 8

# --- optimiser ------------------------------------------------------------
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
momentum: 0.937
weight_decay: 0.0005

# --- loss gains -----------------------------------------------------------
box: 7.5
cls: 0.5
dfl: 1.5

# --- augmentation ---------------------------------------------------------
mosaic: 1.0
mixup: 0.10
copy_paste: 0.30           # stock YOLO copy-paste
close_mosaic: 20
fliplr: 0.5
flipud: 0.0
degrees: 0.0
translate: 0.1
scale: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# --- aux modules ----------------------------------------------------------
# Phase A adds none. Later phases set these in their own configs.
use_attention: false
use_physics: false
use_contrastive: false
